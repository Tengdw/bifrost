name: bifrost-test
services:
  app:
    image: ${BIFROST_IMAGE:-bifrost:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["-mode", "${BIFROST_MODE:-synthetic}", "-port", "8080"]
    environment:
      BIFROST_LISTEN_ADDR: 0.0.0.0:8080
      BIFROST_PUBLIC_ORIGIN: ${BIFROST_PUBLIC_ORIGIN:?Set the browser-facing HTTPS origin}
      DATABASE_URL_FILE: /run/bifrost/database-url
      MASTER_KEY_FILE: /run/bifrost/master-key
      SESSION_TOKEN_FILE: /run/bifrost/session-token
      TLS_CERT_FILE: /run/bifrost/tls.crt
      TLS_KEY_FILE: /run/bifrost/tls.key
    volumes:
      - type: bind
        source: ${BIFROST_CONFIG_DIR:?Set an absolute path to the dedicated configuration directory}
        target: /run/bifrost
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 8080
        published: "${BIFROST_HTTPS_PORT:-8443}"
        host_ip: ${BIFROST_BIND_IP:?Set the server LAN address}
        protocol: tcp
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    scale: 1
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
