name: bifrost
services:
  app:
    image: ${BIFROST_IMAGE:-bifrost:local}
    build: .
    command: ["-mode", "readonly"]
    environment:
      BIFROST_LISTEN_ADDR: 0.0.0.0:8080
      BIFROST_PUBLIC_ORIGIN: ${BIFROST_PUBLIC_ORIGIN:?Set the external HTTPS origin}
      BIFROST_EXPECT_DATABASE: bifrost
      BIFROST_DISABLE_AUTO_SYNC: ${BIFROST_DISABLE_AUTO_SYNC:-0}
      DATABASE_URL_FILE: /run/bifrost/database-url
      MASTER_KEY_FILE: /run/bifrost/master-key
    volumes:
      - ${BIFROST_RUNTIME_DIR:?Use make deploy}/database-url:/run/bifrost/database-url:ro
      - ${BIFROST_RUNTIME_DIR}/master-key:/run/bifrost/master-key:ro
    ports:
      - "${BIFROST_BIND_IP:-127.0.0.1}:${BIFROST_HTTP_PORT:-8080}:8080"
    user: "${BIFROST_RUNTIME_UID:-10001}:${BIFROST_RUNTIME_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    scale: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
